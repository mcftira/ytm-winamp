name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install -U pip
          pip install -e .[liked] pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build single-file exe
        run: pyinstaller --onefile --name ytm-winamp --collect-all yt_dlp launcher.py

      - name: Smoke test the exe
        run: dist/ytm-winamp.exe --version

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} dist/ytm-winamp.exe --generate-notes --verify-tag
