ShortDescription: Play YouTube and YouTube Music audio in classic Winamp 5.x through a local HTTP bridge
Description: |-
  ytm-winamp streams YouTube and YouTube Music audio into classic Winamp 5.x
  through a local HTTP bridge with ICY (SHOUTcast) title metadata.
  One command queues a shuffled 1995-2005 hit parade mixed with your country's
  number-one hits of the era; upcoming tracks are prefetched to a disk cache so
  skipping is instant. It also plays search queries, video URLs, whole
  playlists, and (optionally) your YouTube Music likes.
